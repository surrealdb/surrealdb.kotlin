name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  jvm:
    runs-on: ubuntu-latest
    env:
      SURREAL_RUN_INTEGRATION: "true"
      SURREAL_JVM_ENDPOINT: "http://127.0.0.1:8000"
      SURREALDB_IMAGE: "surrealdb/surrealdb:latest"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 "$SURREALDB_IMAGE" start --user root --pass root memory
          for i in {1..20}; do
            if curl -fsS "$SURREAL_JVM_ENDPOINT/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs surrealdb
          exit 1

      - name: Run JVM tests
        run: ./gradlew --no-daemon jvmTest

      - name: SurrealDB logs
        if: always()
        run: docker logs surrealdb || true
